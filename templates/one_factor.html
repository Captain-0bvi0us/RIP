<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{.factor.Title}}</title>
    <link rel="stylesheet" href="/resources/styles/main.css">
</head>

<body>
    
    <header>
        <div class="logo">FRAXCALCULATOR.ORG</div>
        <div><a class="refToMenu" href="/FRAX">Факторы</a></div>
    </header>

    <div class="header-text">{{.factor.Title}}</div>
    <div class="header-line"></div>

    <div class="container">
        <div class="card card-for-one-factor">
            <img class="card-img" src="{{.factor.Image}}" alt="">
            <div class="card-content">
                <p class="card-title">{{.factor.Title}}</p>
                <p class="card-text">{{.factor.Text}}</p>
            </div>
        </div>
    </div>

</body>
</html>
